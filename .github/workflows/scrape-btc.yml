name: 抓取比特币今日行情

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install yfinance

      - name: 抓取 & 解析
        run: python scripts/scrape.py
        working-directory: ./sources/btc-price
        working-directory: ./sources/btc-price

      - name: 提交 & 推送
        run: |
          git config user.name "wherejiahe-bot"
          git config user.email "wherejiahe-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add sources/btc-price/data/
            git commit -m "auto: 更新比特币行情 $(date -u '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "无变化，跳过提交"
          fi
